
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbmpbox"
version = "0.1.0"
description = "A Python code collection and downloader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jeel Savaliya"}
]

[project.scripts]
sbmpbox = "sbmpbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
